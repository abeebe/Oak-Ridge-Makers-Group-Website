name: Deploy to Cloudflare Pages

# Direct Upload deploy to the "ormakers" Cloudflare Pages project.
# Production deploys run on push to main (fires only after this PR is
# merged). Any other branch/PR gets its own preview deployment.

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=ormakers --branch=${{ github.head_ref || github.ref_name }}
